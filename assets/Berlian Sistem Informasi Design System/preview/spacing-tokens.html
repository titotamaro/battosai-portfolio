<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; padding: 20px; font-family: 'Inter', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 14px; }
  .sp { background: #1a56db; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; }
  .sp-label { font-size: 9px; color: white; font-weight: 600; }
  .sp-val { font-size: 8px; color: rgba(255,255,255,0.7); font-family: monospace; }
  .radii { display: flex; gap: 10px; align-items: center; }
  .rad { background: white; border: 2px solid #1a56db; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; }
  .rad-label { font-size: 9px; color: #475569; font-weight: 600; margin-top: 4px; }
  .rad-val { font-size: 8px; color: #94a3b8; font-family: monospace; }
  .section-title { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="section-title">Spacing Scale</div>
<div class="grid">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:4px;"></div><div class="sp-label" style="color:#64748b;">1</div><div class="sp-val" style="color:#94a3b8;">4px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:8px;"></div><div class="sp-label" style="color:#64748b;">2</div><div class="sp-val" style="color:#94a3b8;">8px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:12px;"></div><div class="sp-label" style="color:#64748b;">3</div><div class="sp-val" style="color:#94a3b8;">12px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:16px;"></div><div class="sp-label" style="color:#64748b;">4</div><div class="sp-val" style="color:#94a3b8;">16px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:24px;"></div><div class="sp-label" style="color:#64748b;">6</div><div class="sp-val" style="color:#94a3b8;">24px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:32px;"></div><div class="sp-label" style="color:#64748b;">8</div><div class="sp-val" style="color:#94a3b8;">32px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:48px;"></div><div class="sp-label" style="color:#64748b;">12</div><div class="sp-val" style="color:#94a3b8;">48px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="sp" style="width:100%;height:64px;"></div><div class="sp-label" style="color:#64748b;">16</div><div class="sp-val" style="color:#94a3b8;">64px</div></div>
</div>
<div class="section-title" style="margin-top:4px;">Border Radius</div>
<div class="radii">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:4px;width:44px;height:44px;"></div><div class="rad-label">sm</div><div class="rad-val">4px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:6px;width:44px;height:44px;"></div><div class="rad-label">md</div><div class="rad-val">6px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:10px;width:44px;height:44px;"></div><div class="rad-label">lg</div><div class="rad-val">10px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:16px;width:44px;height:44px;"></div><div class="rad-label">xl</div><div class="rad-val">16px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:24px;width:44px;height:44px;"></div><div class="rad-label">2xl</div><div class="rad-val">24px</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div class="rad" style="border-radius:9999px;width:44px;height:44px;"></div><div class="rad-label">full</div><div class="rad-val">9999px</div></div>
</div>
</body>
</html>
