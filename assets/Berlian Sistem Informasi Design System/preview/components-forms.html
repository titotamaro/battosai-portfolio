<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; padding: 20px; font-family: 'Inter', sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
  input, select, textarea { width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; color: #0f172a; background: white; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 9px 12px; outline: none; transition: border 0.15s, box-shadow 0.15s; }
  input.focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
  input.error { border-color: #dc2626; }
  .field { min-width: 160px; flex: 1; }
  .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
  .error-msg { font-size: 11px; color: #dc2626; margin-top: 4px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:9999px; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<div class="row">
  <div class="field"><label>Default</label><input type="text" placeholder="Masukkan teks..." value=""></div>
  <div class="field"><label>Focused</label><input type="text" class="focus" placeholder="" value="berlian@contoh.co.id"></div>
  <div class="field"><label>Error</label><input type="text" class="error" value="teks tidak valid"><div class="error-msg">Format tidak valid.</div></div>
  <div class="field"><label>Disabled</label><input type="text" disabled value="Tidak dapat diedit" style="background:#f1f5f9;color:#94a3b8;cursor:not-allowed;"></div>
</div>
<div class="row">
  <div class="field"><label>Dropdown</label>
    <select><option>Pilih opsi…</option><option>Jakarta</option><option>Surabaya</option><option>Bandung</option></select>
  </div>
  <div class="field"><label>Textarea</label>
    <textarea rows="3" placeholder="Deskripsi singkat…"></textarea>
  </div>
</div>
<div class="row" style="align-items:center; gap:8px;">
  <span class="badge" style="background:#eff6ff;color:#1a46b8;">Info</span>
  <span class="badge" style="background:#f0fdf4;color:#16a34a;">Aktif</span>
  <span class="badge" style="background:#fffbeb;color:#d97706;">Pending</span>
  <span class="badge" style="background:#fef2f2;color:#dc2626;">Nonaktif</span>
  <span class="badge" style="background:#0d2461;color:white;">Enterprise</span>
  <span class="badge" style="background:#1a56db;color:white;">Baru</span>
</div>
</body>
</html>
