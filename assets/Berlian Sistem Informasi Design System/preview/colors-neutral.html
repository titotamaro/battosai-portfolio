<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .swatch { flex: 1; border-radius: 6px; overflow: hidden; }
  .color { height: 56px; }
  .label { padding: 5px 7px; background: white; border-top: 1px solid #e2e8f0; }
  .name { font-size: 10px; font-weight: 600; color: #334155; }
  .hex  { font-size: 9px; color: #94a3b8; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="color" style="background:#0a0f1e"></div><div class="label"><div class="name">950</div><div class="hex">#0a0f1e</div></div></div>
  <div class="swatch"><div class="color" style="background:#0f172a"></div><div class="label"><div class="name">900</div><div class="hex">#0f172a</div></div></div>
  <div class="swatch"><div class="color" style="background:#1e293b"></div><div class="label"><div class="name">800</div><div class="hex">#1e293b</div></div></div>
  <div class="swatch"><div class="color" style="background:#334155"></div><div class="label"><div class="name">700</div><div class="hex">#334155</div></div></div>
  <div class="swatch"><div class="color" style="background:#475569"></div><div class="label"><div class="name">600</div><div class="hex">#475569</div></div></div>
  <div class="swatch"><div class="color" style="background:#64748b"></div><div class="label"><div class="name">500</div><div class="hex">#64748b</div></div></div>
  <div class="swatch"><div class="color" style="background:#94a3b8"></div><div class="label"><div class="name">400</div><div class="hex">#94a3b8</div></div></div>
  <div class="swatch"><div class="color" style="background:#cbd5e1"></div><div class="label"><div class="name">300</div><div class="hex">#cbd5e1</div></div></div>
  <div class="swatch"><div class="color" style="background:#e2e8f0; border:1px solid #cbd5e1;"></div><div class="label"><div class="name">200</div><div class="hex">#e2e8f0</div></div></div>
  <div class="swatch"><div class="color" style="background:#f1f5f9; border:1px solid #e2e8f0;"></div><div class="label"><div class="name">100</div><div class="hex">#f1f5f9</div></div></div>
  <div class="swatch"><div class="color" style="background:#f8fafc; border:1px solid #e2e8f0;"></div><div class="label"><div class="name">50</div><div class="hex">#f8fafc</div></div></div>
</div>
<div class="row" style="gap:10px;">
  <div class="swatch" style="flex:1; height:44px; background:#16a34a; border-radius:6px; display:flex; align-items:center; padding:0 12px;"><span style="color:white;font-size:11px;font-weight:600;">Success #16a34a</span></div>
  <div class="swatch" style="flex:1; height:44px; background:#d97706; border-radius:6px; display:flex; align-items:center; padding:0 12px;"><span style="color:white;font-size:11px;font-weight:600;">Warning #d97706</span></div>
  <div class="swatch" style="flex:1; height:44px; background:#dc2626; border-radius:6px; display:flex; align-items:center; padding:0 12px;"><span style="color:white;font-size:11px;font-weight:600;">Error #dc2626</span></div>
  <div class="swatch" style="flex:1; height:44px; background:#0284c7; border-radius:6px; display:flex; align-items:center; padding:0 12px;"><span style="color:white;font-size:11px;font-weight:600;">Info #0284c7</span></div>
</div>
</body>
</html>
