<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f1f5f9; padding: 20px; font-family: 'Inter', sans-serif; display: flex; gap: 16px; align-items: flex-start; }
  .card { background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; width: 120px; height: 80px; }
  .label { font-size: 10px; color: #64748b; font-weight: 600; text-align: center; margin-top: 8px; font-family: monospace; }
  .item { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="item"><div class="card" style="box-shadow: 0 1px 3px rgba(13,36,97,0.08), 0 1px 2px rgba(13,36,97,0.06);"></div><div class="label">shadow-sm</div></div>
  <div class="item"><div class="card" style="box-shadow: 0 4px 12px rgba(13,36,97,0.10), 0 2px 4px rgba(13,36,97,0.06);"></div><div class="label">shadow-md</div></div>
  <div class="item"><div class="card" style="box-shadow: 0 8px 32px rgba(13,36,97,0.14), 0 4px 8px rgba(13,36,97,0.08);"></div><div class="label">shadow-lg</div></div>
  <div class="item"><div class="card" style="box-shadow: 0 20px 60px rgba(13,36,97,0.18), 0 8px 16px rgba(13,36,97,0.10);"></div><div class="label">shadow-xl</div></div>
  <div class="item"><div class="card" style="box-shadow: inset 0 2px 4px rgba(13,36,97,0.08);border:1px solid #e2e8f0;"></div><div class="label">shadow-inner</div></div>
</body>
</html>
