<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; padding: 20px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .block { flex: 1; border-radius: 8px; padding: 20px 24px; display: flex; align-items: center; }
  .wordmark { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 1.75rem; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.15; }
</style>
<style>
  @font-face { font-family: 'Inter'; src: url('../fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('../fonts/Inter-Italic-VariableFont_opsz_wght.ttf') format('truetype'); font-weight: 100 900; font-style: italic; font-display: swap; }
</style>
</head>
<body>
<div class="row">
  <div class="block" style="background:white; border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(13,36,97,0.08);">
    <div class="wordmark" style="color:#0f172a;">PT BERLIAN<br>SISTEM INFORMASI</div>
  </div>
  <div class="block" style="background:#0d2461;">
    <div class="wordmark" style="color:white;">PT BERLIAN<br>SISTEM INFORMASI</div>
  </div>
  <div class="block" style="background:linear-gradient(135deg,#061540,#1a56db);">
    <div class="wordmark" style="color:white;">PT BERLIAN<br>SISTEM INFORMASI</div>
  </div>
  <div class="block" style="background:#1a56db;">
    <div class="wordmark" style="color:white;">PT BERLIAN<br>SISTEM INFORMASI</div>
  </div>
</div>
</body>
</html>
