<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; padding: 20px; font-family: 'Inter', sans-serif; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .bg { border-radius: 10px; display: flex; align-items: center; padding: 20px 24px; }
  .caption { font-size: 10px; font-weight: 600; color: #94a3b8; text-align: center; margin-top: 8px; letter-spacing: 0.06em; text-transform: uppercase; }
  .item { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="item">
    <div class="bg" style="background:white; border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(13,36,97,0.08);">
      <img src="../assets/logo-original.png" style="height:48px;">
    </div>
    <div class="caption">Original · Light BG</div>
  </div>
  <div class="item">
    <div class="bg" style="background:#0d2461;">
      <img src="../assets/logo-white-text.png" style="height:48px;">
    </div>
    <div class="caption">White Text · Navy BG</div>
  </div>
  <div class="item">
    <div class="bg" style="background:linear-gradient(135deg,#061540,#1a56db);">
      <img src="../assets/logo-all-white.png" style="height:48px;">
    </div>
    <div class="caption">All White · Gradient BG</div>
  </div>
  <div class="item">
    <div class="bg" style="background:white; border:1px solid #e2e8f0;">
      <img src="../assets/logo-black-text.png" style="height:48px;">
    </div>
    <div class="caption">Flat Icon · Light BG</div>
  </div>
  <div class="item">
    <div class="bg" style="background:#1a56db;">
      <img src="../assets/logo-icon-white.png" style="height:48px;">
    </div>
    <div class="caption">Icon Only · Brand Blue</div>
  </div>
</body>
</html>
